name: Link Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lychee
        env:
          LYCHEE_VERSION: lychee-v0.24.2
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)
              target="x86_64-unknown-linux-musl"
              ;;
            aarch64 | arm64)
              target="aarch64-unknown-linux-musl"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          asset="lychee-${target}.tar.gz"
          base_url="https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}"
          install_dir="${RUNNER_TEMP}/lychee"
          bin_dir="${RUNNER_TEMP}/lychee-bin"

          mkdir -p "${install_dir}"
          cd "${install_dir}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}"
          mkdir -p "${bin_dir}"
          find "${install_dir}" -type f -name lychee -perm /111 -exec cp {} "${bin_dir}/lychee" \; -quit
          "${bin_dir}/lychee" --version
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Link Checker
        run: lychee --verbose --no-progress --root-dir "${GITHUB_WORKSPACE}" --config .github/lychee.toml .
        env:
          GITHUB_TOKEN: ${{ github.token }}
